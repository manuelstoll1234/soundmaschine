<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOUNDMASCHINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ---- palette: warm neutrals biased toward the accent, VU-meter amber for
   Manuel (valve glow / hi-fi meter), neon magenta for Maya (80s). ---- */
:root{
  --bg:#fbfaf8; --bg2:#f2f0ec; --bg3:#e8e5df; --bg4:#dad6ce;
  --fg:#17150f; --fg2:#57534a; --fg3:#8b8578;
  --line:#dfdbd3;
  --accent:#c25a00; --accent2:#9c4400; --accent-fg:#fff8f0;
  --radius:10px;
  --bar-h:112px; --side-w:248px;
  --f-disp:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root body.u-maya{ --accent:#b8006b; --accent2:#8f0053; --accent-fg:#fff5fa; }

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d0c0a; --bg2:#161410; --bg3:#201d18; --bg4:#2e2a23;
    --fg:#f6f3ed; --fg2:#a49d90; --fg3:#6e685c;
    --line:#2b2721;
    --accent:#ff9426; --accent2:#e0740c; --accent-fg:#1a0f02;
  }
  :root:not([data-theme="light"]) body.u-maya{ --accent:#ff4f9a; --accent2:#d92d78; --accent-fg:#22040f; }
}
:root[data-theme="dark"]{
  --bg:#0d0c0a; --bg2:#161410; --bg3:#201d18; --bg4:#2e2a23;
  --fg:#f6f3ed; --fg2:#a49d90; --fg3:#6e685c;
  --line:#2b2721;
  --accent:#ff9426; --accent2:#e0740c; --accent-fg:#1a0f02;
}
:root[data-theme="dark"] body.u-maya{ --accent:#ff4f9a; --accent2:#d92d78; --accent-fg:#22040f; }

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);
  font:15px/1.5 var(--f-body);
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
#shell{display:grid;grid-template-columns:var(--side-w) 1fr;height:100vh;padding-bottom:var(--bar-h)}

/* ---------- sidebar ---------- */
#side{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 14px;font-family:var(--f-disp);font-weight:800;letter-spacing:1.4px;font-size:14.5px}
.brand .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:14px;flex:none}

.usr{margin:0 12px 14px;position:relative}
.usr-btn{width:100%;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--radius);background:var(--bg3);border:1px solid var(--line);transition:.15s}
.usr-btn:hover{background:var(--bg4)}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-fg);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.usr-meta{text-align:left;min-width:0;flex:1}
.usr-meta b{display:block;font-size:13.5px}
.usr-meta span{display:block;font-size:11px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usr-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg3);border:1px solid var(--line);border-radius:var(--radius);padding:5px;z-index:60;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.usr-menu[hidden]{display:none}
.usr-menu button{width:100%;display:flex;gap:9px;align-items:center;padding:8px;border-radius:7px;text-align:left}
.usr-menu button:hover{background:var(--bg4)}

nav{padding:0 8px;display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--fg2);font-weight:600;font-size:14px;width:100%;text-align:left;transition:.12s}
.nav:hover{color:var(--fg);background:var(--bg3)}
.nav.on{color:var(--fg);background:var(--bg3)}
.nav.on::before{content:"";position:absolute;margin-left:-12px;width:3px;height:17px;background:var(--accent);border-radius:3px}
.nav i{font-style:normal;width:18px;text-align:center;font-size:15px}

.side-sec{margin-top:16px;padding:0 18px;flex:1;overflow-y:auto;min-height:0}
.side-sec h4{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--fg3);margin-bottom:9px;font-weight:600}
.pl-link{display:flex;align-items:center;gap:8px;width:100%;padding:6px 0;color:var(--fg2);font-size:13px;text-align:left;transition:.12s}
.pl-link:hover{color:var(--fg)}
.pl-link b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-link em{font-style:normal;color:var(--fg3);font-size:11px;flex:none}
.side-foot{padding:12px 18px;border-top:1px solid var(--line);font-size:10.5px;color:var(--fg3);line-height:1.6}

/* ---------- main ---------- */
#main{overflow-y:auto;position:relative}
header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:14px 26px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
h1#ttl{font-family:var(--f-disp);font-size:19px;font-weight:700;letter-spacing:-.2px;flex:none}
.search-wrap{flex:1;max-width:460px;position:relative}
#q{width:100%;padding:9px 14px 9px 36px;border-radius:999px;background:var(--bg3);border:1px solid var(--line);outline:none;font-size:14px}
#q:focus{border-color:var(--accent)}
.search-wrap::before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--fg3);font-size:17px}
.hdr-btn{width:34px;height:34px;border-radius:50%;background:var(--bg3);border:1px solid var(--line);display:grid;place-items:center;font-size:14px;transition:.15s;flex:none}
.hdr-btn:hover{background:var(--bg4)}
#page{padding:22px 26px 40px}

/* ---------- cards ---------- */
.sec{margin-bottom:34px}
.sec-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;gap:12px}
.sec-hd h2{font-family:var(--f-disp);font-size:17px;font-weight:700;letter-spacing:-.2px;text-wrap:balance}
.sec-hd p{font-size:12.5px;color:var(--fg2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:11px;cursor:pointer;transition:.16s;position:relative;overflow:hidden}
.card:hover{background:var(--bg3);transform:translateY(-2px)}
.art{width:100%;aspect-ratio:1;border-radius:7px;object-fit:cover;background:var(--bg4);display:block;margin-bottom:9px}
.art-ph{width:100%;aspect-ratio:1;border-radius:7px;background:linear-gradient(135deg,var(--bg4),var(--bg3));display:grid;place-items:center;font-size:30px;margin-bottom:9px}
.card b{display:block;font-size:13.5px;font-weight:650;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card span{display:block;font-size:12px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.tag{position:absolute;top:16px;right:16px;background:rgba(0,0,0,.72);color:#fff;font-family:var(--f-mono);font-size:9px;font-weight:600;letter-spacing:.4px;padding:3px 6px;border-radius:5px;backdrop-filter:blur(4px)}
.tag.loss{background:var(--accent);color:var(--accent-fg)}

/* rows */
.rows{display:flex;flex-direction:column;gap:1px}
.row{display:grid;grid-template-columns:30px 42px 1fr auto auto auto;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:.12s}
.row:hover{background:var(--bg3)}
.row.playing{background:var(--bg3)}
.row.playing .r-t{color:var(--accent)}
.r-n{color:var(--fg3);font-family:var(--f-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.row:hover .r-n{color:var(--fg)}
.r-a{width:42px;height:42px;border-radius:5px;object-fit:cover;background:var(--bg4)}
.r-m{min-width:0}
.r-t{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-s{font-size:12px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-q{font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.3px;color:var(--fg3);border:1px solid var(--line);padding:2px 5px;border-radius:4px;white-space:nowrap}
.r-q.loss{color:var(--accent);border-color:var(--accent)}
.r-add{width:28px;height:28px;border-radius:50%;color:var(--fg3);font-size:17px;display:grid;place-items:center;opacity:0}
.row:hover .r-add{opacity:1}
.r-add:hover{color:var(--accent);background:var(--bg4)}

/* ---------- player bar ---------- */
#bar{position:fixed;bottom:0;left:0;right:0;height:var(--bar-h);background:var(--bg2);border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(230px,1fr) minmax(280px,38%) minmax(210px,1fr);align-items:center;gap:14px;padding:0 16px;z-index:70}
.np{display:flex;align-items:center;gap:12px;min-width:0}
.np img,.np .ph{width:56px;height:56px;border-radius:7px;object-fit:cover;background:var(--bg4);flex:none;display:grid;place-items:center;font-size:22px}
.np-m{min-width:0;flex:1 1 auto;overflow:hidden}
.np-m b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np-m span{display:block;font-size:11.5px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc{display:flex;flex-direction:column;align-items:center;gap:7px}
.pc-btns{display:flex;align-items:center;gap:14px}
.pb{color:var(--fg2);font-size:15px;transition:.14s;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.pb:hover{color:var(--fg)}
.pb.on{color:var(--accent)}
.pb-play{width:38px;height:38px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:14px;display:grid;place-items:center;transition:.14s}
.pb-play:hover{transform:scale(1.07)}
.seek{display:flex;align-items:center;gap:9px;width:100%}
.seek span{font-family:var(--f-mono);font-size:10.5px;color:var(--fg3);font-variant-numeric:tabular-nums;width:38px;flex:none}
.seek span:last-child{text-align:right}
/* The input is deliberately much taller than the visible bar: the whole height is
   grabbable, while the track pseudo-element keeps the slim look. */
input[type=range]{-webkit-appearance:none;appearance:none;height:22px;background:transparent;
  outline:none;cursor:pointer;flex:1;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--bg4)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--accent);margin-top:-5px;box-shadow:0 1px 4px rgba(0,0,0,.45);transition:transform .12s}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb{transform:scale(1.18)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--bg4)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;
  background:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.45)}
/* the scrub bar is the one people miss most, so give it the largest target */
#seek{height:26px}
#seek::-webkit-slider-runnable-track{height:7px}
#seek::-webkit-slider-thumb{width:19px;height:19px;margin-top:-6px}
#seek::-moz-range-thumb{width:19px;height:19px}
.pr{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
.np .qb{margin-left:6px;flex:0 0 auto}
@media(max-width:1150px){.np .qb{display:none}}
/* Some hosts pin their own badge to the bottom-right corner (Netlify's is 202x64
   at the maximum z-index) and it lands straight on the volume slider. When one is
   detected, clear a lane for it rather than letting it swallow the controls. */
body.hostbadge .pr{padding-right:212px}
.qb{font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.4px;padding:3px 7px;border-radius:5px;border:1px solid var(--line);color:var(--fg2);white-space:nowrap}
.qb.loss{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#vol{width:70px;flex:none}
#viz{width:74px;height:32px;border-radius:6px;background:var(--bg3);cursor:pointer;flex:none}

/* ---------- misc ---------- */
.empty{text-align:center;padding:56px 20px;color:var(--fg2)}
.empty .ic{font-size:42px;margin-bottom:12px;opacity:.5}
.empty b{display:block;font-family:var(--f-disp);font-size:16px;font-weight:700;color:var(--fg);margin-bottom:6px}
.empty p{font-size:13px;max-width:400px;margin:0 auto;line-height:1.65}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--bg4);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{padding:6px 13px;border-radius:999px;background:var(--bg3);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--fg2);transition:.14s;font-family:var(--f-body)}
.chip:hover{color:var(--fg);border-color:var(--fg3)}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn{padding:8px 16px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:13px;transition:.14s}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--bg3);color:var(--fg);border:1px solid var(--line)}
#toast{position:fixed;bottom:calc(var(--bar-h) + 16px);left:50%;transform:translateX(-50%) translateY(16px);background:var(--bg4);border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:.22s;box-shadow:0 8px 28px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.set{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;max-width:660px}
.set h3{font-family:var(--f-disp);font-size:14px;font-weight:700;margin-bottom:5px}
.set p{font-size:12.5px;color:var(--fg2);line-height:1.6;margin-bottom:11px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line)}
.set-row b{font-size:13px;font-weight:600}
.set-row small{display:block;color:var(--fg2);font-size:11.5px;margin-top:1px}
select{padding:6px 11px;border-radius:7px;background:var(--bg3);border:1px solid var(--line);outline:none;font-size:13px}
.hero{display:flex;align-items:flex-end;gap:20px;padding:20px;border-radius:14px;margin-bottom:26px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 26%,var(--bg2)),var(--bg2))}
.hero-art{width:112px;height:112px;border-radius:10px;background:var(--bg4);display:grid;place-items:center;font-size:44px;flex:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.hero small{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--fg2)}
.hero h2{font-family:var(--f-disp);font-size:30px;font-weight:800;letter-spacing:-.8px;line-height:1.1;margin:5px 0 7px;text-wrap:balance}
.hero p{font-size:13px;color:var(--fg2)}

@media(max-width:900px){
  :root{--side-w:0px;--bar-h:128px}
  #shell{grid-template-columns:1fr}
  #side{position:fixed;inset:0 auto 0 0;width:250px;z-index:120;transform:translateX(-100%);transition:.24s}
  #side.open{transform:none}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:110}
  #scrim[hidden]{display:none}
  #bar{grid-template-columns:1fr;grid-auto-rows:auto;gap:6px;padding:9px 14px;align-content:center}
  /* On a phone the volume is a hardware button and the meter is decoration, so
     drop both rather than let them push the bar past the bottom of the screen. */
  #viz,#vol,.pr>span{display:none}
  .pr{justify-content:center;gap:0}
  .pb{width:42px;height:42px;font-size:19px}
  .pb-play{width:54px;height:54px}
  .pc-btns{gap:16px}
  .np img,.np .ph{width:46px;height:46px}
  /* on a narrow screen there is no room for a 212px lane — shift the controls
     left of the badge instead */
  body.hostbadge .pr{padding-right:0;justify-content:center}
  #bFav{position:absolute;right:16px;top:14px}
  #viz{display:none}
  header{padding:12px 16px;gap:10px}
  h1#ttl{display:none}
  #page{padding:16px 16px 30px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
  .row{grid-template-columns:36px 1fr auto auto}
  .row .r-fav{opacity:1}
  .r-n,.r-q{display:none}
  .hero{flex-direction:column;align-items:flex-start}
  .hero h2{font-size:22px}
}
@media(min-width:901px){#menuBtn,#scrim{display:none}}


/* ---------- 1. logo ---------- */
.logo{width:30px;height:30px;flex:none;display:block}

/* ---------- 6. always-visible user switch ---------- */
.usr-seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg3);
  border:1px solid var(--line);border-radius:12px;padding:5px}
.usr-seg button{display:flex;align-items:center;gap:8px;padding:8px 9px;border-radius:9px;
  text-align:left;min-width:0;transition:.15s;border:1px solid transparent}
.usr-seg button:hover{background:var(--bg4)}
.usr-seg button.on{background:var(--bg1);border-color:var(--line)}
.usr-seg .av{width:26px;height:26px;font-size:11.5px}
.usr-seg .un{min-width:0;flex:1}
.usr-seg .un b{display:block;font-size:12.5px;line-height:1.2}
.usr-seg .un i{display:block;font-style:normal;font-size:9.5px;color:var(--fg2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usr-seg button.on .un b{color:var(--accent)}
.u-maya .av,.usr-seg button[data-u="maya"] .av{background:linear-gradient(135deg,#ff4d9d,#c65cff)}

/* ---------- 3. search clear ---------- */
.search-wrap{position:relative}
#qClear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;
  border-radius:50%;display:grid;place-items:center;color:var(--fg2);font-size:12px;
  background:var(--bg4);border:1px solid var(--line);cursor:pointer;transition:.14s}
#qClear:hover{color:var(--fg);background:var(--bg1)}
#qClear[hidden]{display:none}
#q{padding-right:40px}

/* ---------- 4./2. bigger controls, taller bar so nothing clips ---------- */
.pc-btns{gap:18px}
.pb{width:38px;height:38px;font-size:18px}
.pb-play{width:50px;height:50px;font-size:18px}
.seek{gap:11px}
.seek span{font-size:11.5px;width:42px}

/* ---------- 5. now-playing detail line ---------- */
.np-x{display:block;font-family:var(--f-mono);font-size:10px;color:var(--fg3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}

/* ---------- 7. favourites block ---------- */
.fav-hd{display:flex;align-items:center;gap:7px}
.fav-hd .cnt{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--fg2);
  background:var(--bg3);border:1px solid var(--line);border-radius:99px;padding:1px 7px}
.fav-item{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:8px;
  cursor:pointer;width:100%;text-align:left;min-width:0}
.fav-item:hover{background:var(--bg3)}
.fav-item img,.fav-item .ph{width:28px;height:28px;border-radius:5px;object-fit:cover;flex:none;
  background:var(--bg4);display:grid;place-items:center;font-size:12px}
.fav-item .m{min-width:0;flex:1}
.fav-item .m b{display:block;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============================================================
   VISUALIZER — handles the cross-origin taint problem
   ============================================================ */
/* ============================================================
   AUDIO ENGINE — signal chain, EBU R128 loudness, signal integrity

   Graph (CORS-clean sources only — see the note on the two elements):
     MediaElementSource -> gain(normalise/duck) -> EQ biquads -> analyser -> meter -> destination

   Radio streams cannot enter this graph at all: routing an element with no CORS
   headers through Web Audio makes it output silence. Those keep the plain element
   and the engine reports "live, not analysable" rather than a dead meter.
   ============================================================ */

/* ---- EBU R128 / ITU-R BS.1770 loudness, computed off the main thread ----
   The K-weighting coefficients are derived from the spec's filter design rather
   than hard-coded for 48 kHz, because AudioContext picks its own sample rate. */
var LUFS_WORKLET = `
class R128 extends AudioWorkletProcessor {
  constructor(){
    super();
    const fs = sampleRate;
    this.s1 = this.shelf(fs); this.s2 = this.hpf(fs);
    this.st = [];                       // per-channel filter state
    this.blockLen = Math.round(fs*0.4); // 400 ms block
    this.hop = Math.round(fs*0.1);      // 75% overlap
    this.buf = []; this.filled = 0;
    this.blocks = [];                   // block mean-squares, for gating
    this.short = [];                    // last 30 hops = 3 s
    this.tp = 0; this.sp = 0;
    this.since = 0;
  }
  shelf(fs){ const f0=1681.974450955533,G=3.999843853973347,Q=0.7071752369554196;
    const K=Math.tan(Math.PI*f0/fs), Vh=Math.pow(10,G/20), Vb=Math.pow(Vh,0.4996667741545416);
    const a0=1+K/Q+K*K;
    return {b0:(Vh+Vb*K/Q+K*K)/a0, b1:2*(K*K-Vh)/a0, b2:(Vh-Vb*K/Q+K*K)/a0,
            a1:2*(K*K-1)/a0, a2:(1-K/Q+K*K)/a0}; }
  hpf(fs){ const f0=38.13547087602444,Q=0.5003270373238773;
    const K=Math.tan(Math.PI*f0/fs), a0=1+K/Q+K*K;
    return {b0:1,b1:-2,b2:1, a1:2*(K*K-1)/a0, a2:(1-K/Q+K*K)/a0}; }
  biq(x,f,s,i){ const y=f.b0*x+f.b1*s[i].x1+f.b2*s[i].x2-f.a1*s[i].y1-f.a2*s[i].y2;
    s[i].x2=s[i].x1; s[i].x1=x; s[i].y2=s[i].y1; s[i].y1=y; return y; }

  process(inputs){
    const inp = inputs[0];
    if (!inp || !inp.length) return true;
    const n = inp[0].length, ch = inp.length;
    while (this.st.length < ch) this.st.push({A:[{x1:0,x2:0,y1:0,y2:0}],B:[{x1:0,x2:0,y1:0,y2:0}]});
    if (!this.buf.length) for (let c=0;c<ch;c++) this.buf.push(new Float32Array(this.blockLen));

    for (let i=0;i<n;i++){
      for (let c=0;c<ch;c++){
        const raw = inp[c][i];
        const a = Math.abs(raw); if (a > this.sp) this.sp = a;
        // 4x oversample estimate for inter-sample peaks
        const s = this.st[c];
        if (s.p1 !== undefined){
          for (let k=1;k<4;k++){ const t=k/4;
            const v = Math.abs(s.p1 + (raw - s.p1)*t + 0.5*t*(1-t)*((raw-s.p1)-(s.p1-(s.p0||s.p1))));
            if (v > this.tp) this.tp = v; }
        }
        s.p0 = s.p1; s.p1 = raw;
        if (a > this.tp) this.tp = a;
        // K-weight then accumulate
        const y = this.biq(this.biq(raw, this.s1, s.A, 0), this.s2, s.B, 0);
        this.buf[c][this.filled] = y;
      }
      this.filled++;
      if (this.filled >= this.blockLen){
        let power = 0;
        for (let c=0;c<ch;c++){ let sum=0; const b=this.buf[c];
          for (let j=0;j<this.blockLen;j++) sum += b[j]*b[j];
          power += sum/this.blockLen; }              // channel weight 1.0 for L/R
        this.blocks.push(power);
        this.short.push(power); if (this.short.length > 30) this.short.shift();
        // slide by one hop
        for (let c=0;c<ch;c++) this.buf[c].copyWithin(0, this.hop);
        this.filled = this.blockLen - this.hop;
        this.emit(power);
      }
    }
    return true;
  }

  L(p){ return p > 0 ? -0.691 + 10*Math.log10(p) : -Infinity; }

  emit(momentaryPower){
    // integrated: absolute gate at -70 LUFS, then relative gate 10 LU down
    let keep = this.blocks.filter(p => this.L(p) >= -70);
    let integ = -Infinity;
    if (keep.length){
      const mean = keep.reduce((a,b)=>a+b,0)/keep.length;
      const thr = this.L(mean) - 10;
      const keep2 = keep.filter(p => this.L(p) >= thr);
      if (keep2.length) integ = this.L(keep2.reduce((a,b)=>a+b,0)/keep2.length);
    }
    const shortP = this.short.length ? this.short.reduce((a,b)=>a+b,0)/this.short.length : 0;
    this.port.postMessage({
      m: this.L(momentaryPower),
      s: this.L(shortP),
      i: integ,
      tp: this.tp > 0 ? 20*Math.log10(this.tp) : -Infinity,
      sp: this.sp > 0 ? 20*Math.log10(this.sp) : -Infinity
    });
  }
}
registerProcessor('r128', R128);
`;

var Engine = {
  ac: null, src: null, gain: null, an: null, meter: null,
  eq: [], dead: false, ready: false,
  bands: [60, 250, 1000, 4000, 12000],
  eqGains: Store.get('eq', [0, 0, 0, 0, 0]),
  preamp: Store.get('preamp', 0),
  normalise: Store.get('norm', false),
  lufs: { m: -Infinity, s: -Infinity, i: -Infinity, tp: -Infinity, sp: -Infinity },

  /* Build once. Everything is wrapped: a failure here must never stop playback. */
  attach: function () {
    if (this.dead || this.src) {
      if (this.ac && this.ac.state === 'suspended') this.ac.resume().catch(function () {});
      return;
    }
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.dead = true; return; }
      this.ac = new AC();
      this.src = this.ac.createMediaElementSource(auCors);

      this.gain = this.ac.createGain();
      this.gain.gain.value = 1;

      var self = this, prev = this.gain;
      this.eq = this.bands.map(function (f, i) {
        var b = self.ac.createBiquadFilter();
        b.type = (i === 0) ? 'lowshelf' : (i === self.bands.length - 1 ? 'highshelf' : 'peaking');
        b.frequency.value = f; b.Q.value = 1.0;
        b.gain.value = self.eqGains[i] || 0;
        prev.connect(b); prev = b;
        return b;
      });

      this.an = this.ac.createAnalyser();
      this.an.fftSize = 2048;                    /* enough bins for a 128-band RTA */
      this.an.smoothingTimeConstant = 0.75;
      prev.connect(this.an);

      this.src.connect(this.gain);
      this.an.connect(this.ac.destination);      /* MUST reconnect or audio goes silent */

      this.data = new Uint8Array(this.an.frequencyBinCount);
      this.time = new Float32Array(this.an.fftSize);
      this.ready = true;
      this._loudness();
      this.applyEQ();
    } catch (e) {
      this.dead = true;                          /* blocked context or double-connect */
    }
    if (this.ac && this.ac.state === 'suspended') this.ac.resume().catch(function () {});
  },

  /* Loudness runs in an AudioWorklet so the main thread stays free for painting.
     The module is a Blob URL, which keeps the app a single file. */
  _loudness: function () {
    var self = this;
    if (!this.ac.audioWorklet) return;            /* Safari <14.1 — meter stays idle */
    try {
      var url = URL.createObjectURL(new Blob([LUFS_WORKLET], { type: 'application/javascript' }));
      this.ac.audioWorklet.addModule(url).then(function () {
        URL.revokeObjectURL(url);
        try {
          self.meter = new AudioWorkletNode(self.ac, 'r128');
          self.meter.port.onmessage = function (e) { self.lufs = e.data; };
          /* tap in parallel: the meter must not sit in the audible path */
          self.an.connect(self.meter);
        } catch (e) { /* meter unavailable — everything else still works */ }
      }).catch(function () {});
    } catch (e) {}
  },

  applyEQ: function () {
    var self = this;
    if (!this.ready) return;
    this.eq.forEach(function (b, i) { b.gain.value = self.eqGains[i] || 0; });
    var lin = Math.pow(10, (this.preamp || 0) / 20);
    if (this.gain) this.gain.gain.setTargetAtTime(lin, this.ac.currentTime, 0.05);
    Store.set('eq', this.eqGains); Store.set('preamp', this.preamp);
  },

  eqActive: function () {
    return (this.eqGains || []).some(function (g) { return Math.abs(g) > 0.05; }) ||
           Math.abs(this.preamp || 0) > 0.05;
  },

  /* Duck the low end briefly — used when a notification-style event fires. */
  duck: function (ms) {
    if (!this.ready || !this.gain) return;
    var t = this.ac.currentTime, g = this.gain.gain;
    var base = Math.pow(10, (this.preamp || 0) / 20);
    g.cancelScheduledValues(t);
    g.setTargetAtTime(base * 0.25, t, 0.04);
    g.setTargetAtTime(base, t + (ms || 900) / 1000, 0.12);
  },

  /* What the signal actually went through, for the integrity readout. */
  path: function (track) {
    if (!track) return null;
    var live = track.source === 'Radio';
    var lossless = !!track.lossless;
    var srcRate = track.rate || null;                  /* archive gives us this sometimes */
    var ctxRate = this.ac ? this.ac.sampleRate : null;
    var processed = this.eqActive();
    var analysed = !live && this.ready && !this.dead;
    var grade = live ? 'live' : (!lossless ? 'lossy'
              : (processed || (srcRate && ctxRate && srcRate !== ctxRate) ? 'lossless' : 'perfect'));
    return {
      grade: grade, live: live, lossless: lossless, processed: processed,
      srcRate: srcRate, ctxRate: ctxRate, analysed: analysed,
      codec: track.quality || '—',
      nodes: live
        ? ['Stream', 'HTML5 Audio', 'Output']
        : ['Stream', 'Web Audio', processed ? 'EQ · ' + this.eqGains.filter(function(g){return Math.abs(g)>0.05;}).length + ' band' : 'EQ bypassed',
           'Analyser', 'Output']
    };
  }
};

/* ============================================================
   VISUAL LAYER — VU meter, RTA spectrogram, ambilight
   ============================================================ */

/* Dominant-colour extraction. ColorThief would be another dependency and another
   CDN request; this is ~25 lines of histogram bucketing on a downsampled canvas
   and gives the same answer for our purposes. */
var Palette = {
  cache: {},
  from: function (url, cb) {
    if (!url) return cb(null);
    if (this.cache[url]) return cb(this.cache[url]);
    var self = this, img = new Image();
    img.crossOrigin = 'anonymous';               /* required or the canvas taints */
    img.onload = function () {
      try {
        var n = 40, c = document.createElement('canvas');
        c.width = n; c.height = n;
        var x = c.getContext('2d', { willReadFrequently: true });
        x.drawImage(img, 0, 0, n, n);
        var d = x.getImageData(0, 0, n, n).data;  /* throws if tainted */
        var buckets = {};
        for (var i = 0; i < d.length; i += 4) {
          if (d[i + 3] < 128) continue;
          var r = d[i], g = d[i + 1], b = d[i + 2];
          var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
          if (mx < 26 || mn > 235) continue;      /* skip near-black and near-white */
          var k = (r >> 4) + ',' + (g >> 4) + ',' + (b >> 4);
          var e = buckets[k] || (buckets[k] = { n: 0, r: 0, g: 0, b: 0, sat: 0 });
          e.n++; e.r += r; e.g += g; e.b += b; e.sat += (mx - mn);
        }
        var list = Object.keys(buckets).map(function (k) {
          var e = buckets[k];
          return { r: e.r / e.n | 0, g: e.g / e.n | 0, b: e.b / e.n | 0,
                   score: e.n * (1 + (e.sat / e.n) / 90) };   /* favour saturated colour */
        }).sort(function (a, b2) { return b2.score - a.score; });
        if (!list.length) return cb(null);
        var out = { a: list[0], b: list[1] || list[0] };
        self.cache[url] = out;
        cb(out);
      } catch (e) { cb(null); }                   /* cross-origin image without CORS */
    };
    img.onerror = function () { cb(null); };
    img.src = url;
  }
};

var Ambilight = {
  on: Store.get('ambi', true),
  apply: function (track) {
    var root = document.documentElement;
    if (!this.on || !track) { this.clear(); return; }
    Palette.from(track.art, function (p) {
      if (!p) { Ambilight.clear(); return; }
      root.style.setProperty('--ambi-a', 'rgb(' + p.a.r + ',' + p.a.g + ',' + p.a.b + ')');
      root.style.setProperty('--ambi-b', 'rgb(' + p.b.r + ',' + p.b.g + ',' + p.b.b + ')');
      document.body.classList.add('ambi');
    });
  },
  clear: function () { document.body.classList.remove('ambi'); },
  toggle: function () {
    this.on = !this.on; Store.set('ambi', this.on);
    if (this.on) this.apply(P.cur); else this.clear();
    return this.on;
  }
};

/* ---- the meter canvas: four modes, all 60fps, all driven off one rAF ---- */
var Viz = {
  cv: $('#viz'), ctx: null, raf: 0, w: 0, h: 0,
  mode: App.vizMode || 0,
  modes: ['bars', 'rta', 'vu', 'wave'],
  labels: { bars: 'Spectrum', rta: 'RTA 128', vu: 'VU', wave: 'Wave' },
  vu: { l: 0, r: 0, peak: 0, peakAt: 0 },

  size: function () {
    var r = this.cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    if (!r.width) return;
    this.cv.width = r.width * d; this.cv.height = r.height * d;
    this.ctx = this.cv.getContext('2d');
    this.ctx.setTransform(d, 0, 0, d, 0, 0);
    this.w = r.width; this.h = r.height;
  },

  attach: function () { Engine.attach(); this.loop(); },

  loop: function () {
    cancelAnimationFrame(this.raf);
    var self = this;
    (function frame() { self.raf = requestAnimationFrame(frame); self.draw(); })();
  },

  /* real data only while the analyser-wired element is the one playing */
  freq: function () {
    if (!Engine.ready || Engine.dead || au !== auCors) return null;
    Engine.an.getByteFrequencyData(Engine.data);
    var sum = 0, d = Engine.data;
    for (var i = 0; i < d.length; i += 8) sum += d[i];
    if (sum === 0) return null;
    return d;
  },
  wave: function () {
    if (!Engine.ready || Engine.dead || au !== auCors) return null;
    Engine.an.getFloatTimeDomainData(Engine.time);
    return Engine.time;
  },

  sim: function (n) {
    var out = new Uint8Array(n), t = Date.now() / 220, live = !au.paused;
    for (var i = 0; i < n; i++) {
      var f = 1 - i / n;
      out[i] = live ? Math.max(0, (Math.sin(t + i * 0.55) * 0.5 + 0.5) * 190 * (0.35 + f * 0.8)) : 0;
    }
    return out;
  },

  accent: function () {
    return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#e8a13a';
  },

  draw: function () {
    if (!this.ctx) { this.size(); if (!this.ctx) return; }
    var c = this.ctx, w = this.w, h = this.h;
    c.clearRect(0, 0, w, h);
    var m = this.modes[this.mode] || 'bars';
    if (m === 'vu') return this.drawVU(c, w, h);
    if (m === 'rta') return this.drawRTA(c, w, h);
    if (m === 'wave') return this.drawWave(c, w, h);
    this.drawBars(c, w, h);
  },

  drawBars: function (c, w, h) {
    var d = this.freq(), n = 28, acc = this.accent();
    var src = d || this.sim(n);
    var bw = w / n;
    for (var i = 0; i < n; i++) {
      var idx = d ? Math.floor(Math.pow(i / n, 1.6) * (d.length * 0.7)) : i;
      var v = (src[idx] || 0) / 255;
      var bh = Math.max(1.5, v * h);
      c.fillStyle = acc;
      c.globalAlpha = 0.45 + v * 0.55;
      c.fillRect(i * bw, h - bh, bw - 1.2, bh);
    }
    c.globalAlpha = 1;
  },

  /* 128-band real-time analyser, log-spaced like a proper RTA */
  drawRTA: function (c, w, h) {
    var d = this.freq(), N = 128, acc = this.accent();
    var src = d || this.sim(N);
    var bw = w / N;
    for (var i = 0; i < N; i++) {
      var idx = d ? Math.floor(Math.pow(i / N, 2.0) * (d.length - 1)) : i;
      var v = (src[idx] || 0) / 255;
      var bh = Math.max(1, v * h);
      /* cool at the bottom, accent at the top — reads as level, not decoration */
      c.fillStyle = v > 0.82 ? '#ff5a5a' : (v > 0.6 ? acc : 'rgba(255,255,255,.34)');
      c.fillRect(i * bw, h - bh, Math.max(0.8, bw - 0.4), bh);
    }
  },

  drawWave: function (c, w, h) {
    var t = this.wave(), acc = this.accent();
    c.strokeStyle = acc; c.lineWidth = 1.4; c.beginPath();
    if (t) {
      for (var i = 0; i < t.length; i += 4) {
        var x = (i / t.length) * w, y = h / 2 + t[i] * h * 0.46;
        i ? c.lineTo(x, y) : c.moveTo(x, y);
      }
    } else {
      var s = this.sim(64);
      for (var j = 0; j < 64; j++) {
        var x2 = (j / 64) * w, y2 = h / 2 + ((s[j] - 95) / 255) * h * 0.7;
        j ? c.lineTo(x2, y2) : c.moveTo(x2, y2);
      }
    }
    c.stroke();
  },

  /* Analog needle with VU ballistics — 300 ms to full deflection, per the standard */
  drawVU: function (c, w, h) {
    var lv = Engine.lufs, acc = this.accent();
    var db = (lv && isFinite(lv.m)) ? lv.m : null;
    /* map -40..0 LUFS onto 0..1; fall back to the simulated bar energy */
    var target;
    if (db != null) target = Math.max(0, Math.min(1, (db + 40) / 40));
    else { var s = this.sim(8), sum = 0; for (var i = 0; i < 8; i++) sum += s[i];
           target = Math.min(1, sum / (8 * 255) * 1.6); }
    this.vu.l += (target - this.vu.l) * 0.16;              /* ~300ms rise at 60fps */
    if (this.vu.l > this.vu.peak) { this.vu.peak = this.vu.l; this.vu.peakAt = Date.now(); }
    else if (Date.now() - this.vu.peakAt > 900) this.vu.peak *= 0.94;

    var cx = w / 2, cy = h * 1.06, R = Math.min(w * 0.46, h * 0.92);
    /* arc */
    c.strokeStyle = 'rgba(255,255,255,.16)'; c.lineWidth = 1;
    c.beginPath(); c.arc(cx, cy, R, Math.PI * 1.18, Math.PI * 1.82); c.stroke();
    /* red zone */
    c.strokeStyle = 'rgba(255,90,90,.55)'; c.lineWidth = 2;
    c.beginPath(); c.arc(cx, cy, R, Math.PI * 1.66, Math.PI * 1.82); c.stroke();
    /* peak ghost */
    var pa = Math.PI * (1.18 + 0.64 * this.vu.peak);
    c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(cx + Math.cos(pa) * R * 0.55, cy + Math.sin(pa) * R * 0.55);
    c.lineTo(cx + Math.cos(pa) * R, cy + Math.sin(pa) * R); c.stroke();
    /* needle */
    var a = Math.PI * (1.18 + 0.64 * this.vu.l);
    c.strokeStyle = this.vu.l > 0.75 ? '#ff5a5a' : acc; c.lineWidth = 1.8;
    c.beginPath(); c.moveTo(cx, cy);
    c.lineTo(cx + Math.cos(a) * R * 0.94, cy + Math.sin(a) * R * 0.94); c.stroke();
    c.fillStyle = acc; c.beginPath(); c.arc(cx, cy, 2.2, 0, 6.3); c.fill();
  },

  cycle: function () {
    this.mode = (this.mode + 1) % this.modes.length;
    Store.set('viz', this.mode);
    toast(this.labels[this.modes[this.mode]]);
  }
};

/* ============================================================
   SIGNAL DRAWER — integrity readout, R128 meters, EQ, liner notes
   ============================================================ */
var Drawer = {
  open: false, raf: 0, tab: 'signal',

  toggle: function (tab) {
    if (tab && tab !== this.tab && this.open) { this.tab = tab; this.render(); return; }
    this.open = !this.open;
    if (tab) this.tab = tab;
    document.body.classList.toggle('drw-open', this.open);
    if (this.open) { this.render(); this.tick(); }
    else cancelAnimationFrame(this.raf);
  },

  tick: function () {
    var self = this;
    cancelAnimationFrame(this.raf);
    (function f() {
      self.raf = requestAnimationFrame(f);
      if (self.tab === 'signal') self.paintMeters();
    })();
  },

  db: function (v, unit) {
    return (v == null || !isFinite(v)) ? '—' : v.toFixed(1) + (unit || '');
  },

  render: function () {
    var host = $('#drwBody');
    if (!host) return;
    $('#drwTitle').textContent = this.tab === 'signal' ? 'Signal' : 'Liner notes';
    var tabs = $('#drwTabs');
    [].forEach.call(tabs.children, function (b) {
      b.classList.toggle('on', b.dataset.tab === Drawer.tab);
    });
    host.innerHTML = '';
    if (this.tab === 'signal') this.renderSignal(host); else this.renderNotes(host);
  },

  renderSignal: function (host) {
    var t = P.cur, p = Engine.path(t);
    if (!t) { host.appendChild(emptyBox('◌', 'Nothing playing', 'Start a track to see its signal path.')); return; }

    /* --- integrity lamp. Honest about what a browser can and cannot promise. --- */
    var lamp = {
      perfect: ['gold', 'BIT-PERFECT PATH', 'Lossless source, no DSP, no resampling in our graph.'],
      lossless: ['green', 'LOSSLESS', p && p.processed ? 'Lossless source, but EQ is engaged — the signal is being altered.'
                                                       : 'Lossless source, resampled by the audio context.'],

    MB.artist(t.artist, function (info) {

        .forEach(function (r) {

/* keyless, rate-limited to one request per second per their policy */
var MB = {
  cache: {}, last: 0,
  artist: function (name, cb) {
    if (!name || name === 'Unknown') return cb(null);
    if (this.cache[name] !== undefined) return cb(this.cache[name]);
    var self = this, wait = Math.max(0, 1100 - (Date.now() - this.last));
    setTimeout(function () {
      self.last = Date.now();
      var u = 'https://musicbrainz.org/ws/2/artist?fmt=json&limit=1&query=' + encodeURIComponent(name);
      getJSON(u, 9000).then(function (d) {
        var a = d && d.artists && d.artists[0];
        /* the search is fuzzy — reject a weak match rather than show the wrong artist */
        if (!a || a.score < 90 || a.name.toLowerCase() !== String(name).toLowerCase()) {
          self.cache[name] = null; return cb(null);
        }
        var out = { name: a.name, type: a.type || '',
                    area: (a.area && a.area.name) || (a['begin-area'] && a['begin-area'].name) || '',
                    begin: (a['life-span'] && a['life-span'].begin) || '' };
        self.cache[name] = out; cb(out);
      }).catch(function () { self.cache[name] = null; cb(null); });
    }, wait);
  }
};

/* A place chip rather than a tile map: Leaflet plus OSM tiles would be two new
   dependencies and a third-party request on every track, for a field that is
   empty for most of this catalogue. */
var Geo = {
  chip: function (area) {
    var w = el('div', 'geo-chip');
    w.innerHTML = '<span class="pin">◉</span><b>' + esc(area) + '</b>';
    var a = el('a', 'geo-link', 'Open map ↗');
    a.href = 'https://www.openstreetmap.org/search?query=' + encodeURIComponent(area);
    a.target = '_blank'; a.rel = 'noopener';
    w.appendChild(a);
    return w;
  }
};

/* ============================================================
   8. VORSCHLÄGE — aus den zuletzt gehörten Liedern
   Nimmt die letzten Titel aus der History, leitet daraus eine Suche ab und
   schlägt etwas vor, das noch nicht gehört wurde.
   ============================================================ */
var Sugg = {
  el: null, cur: null, timer: 0, pool: [], dismissed: false,

  init: function () {
    this.el = $('#sugg'); if (!this.el) return;
    var self = this;
    $('#sugX').onclick = function () { self.hide(); self.dismissed = true; };
    $('#sugGo').onclick = function () {
      if (!self.cur) return;
      P.play(self.cur, self.pool, self.pool.indexOf(self.cur));
      self.hide();
    };
    $('#sugNext').onclick = function () { self.pick(); };
  },

  reset: function () { this.pool = []; this.cur = null; this.dismissed = false; this.hide(); },

  /* called after a track starts — waits a bit so it never interrupts the moment */
  schedule: function () {
    var self = this;
    clearTimeout(this.timer);
    if (this.dismissed) return;
    this.timer = setTimeout(function () { self.build(); }, 25000);
  },

  /* what did they actually listen to? use the most frequent artist and genre */
  seed: function () {
    var hist = Store.get(pkey('hist'), []);
    if (hist.length < 2) return null;
    var recent = hist.slice(0, 8);
    var byArtist = {}, byGenre = {};
    recent.forEach(function (t) {
      if (t.artist) byArtist[t.artist] = (byArtist[t.artist] || 0) + 1;
      if (t.album && t.source === 'Audius') byGenre[t.album] = (byGenre[t.album] || 0) + 1;
    });
    var topG = Object.keys(byGenre).sort(function (a, b) { return byGenre[b] - byGenre[a]; })[0];
    var topA = Object.keys(byArtist).sort(function (a, b) { return byArtist[b] - byArtist[a]; })[0];
    if (topG) return { q: topG, why: 'Weil du ' + topG + ' hörst' };
    if (topA) return { q: topA, why: 'Ähnlich wie ' + topA };
    return null;
  },

  build: function () {
    var self = this, sd = this.seed();
    if (!sd) return;
    this.why = sd.why;
    Audius.search(sd.q, 25).then(function (list) {
      var hist = Store.get(pkey('hist'), []);
      var heard = {};
      hist.forEach(function (t) { heard[t.id] = 1; });
      self.pool = list.filter(function (t) { return !heard[t.id] && (!P.cur || t.id !== P.cur.id); });
      if (!self.pool.length) return;
      self.pick();
    });
  },

  pick: function () {
    if (!this.pool.length) return;
    var i = Math.floor(Math.random() * this.pool.length);
    this.cur = this.pool[i];
    var w = $('#sugg'); if (w) w.title = this.why || 'Vorschlag';
    $('#sugT').textContent = this.cur.title;
    $('#sugA').textContent = this.cur.artist + ' · ' + mmss(this.cur.dur);
    this.show();
  },

  show: function () { if (this.el && !this.dismissed) this.el.classList.add('on'); },
  hide: function () { if (this.el) this.el.classList.remove('on'); }
};

/* ---- Favoriten: eine Liste, ein Tippen ---- */
function likedList() {
  return (playlists().filter(function (p) { return p.id === 'liked'; })[0] || { tracks: [] }).tracks;
}
function isLiked(t) {
  return likedList().some(function (x) { return x.id === t.id; });
}
function toggleLike(t) {
  var all = playlists();
  var liked = all.filter(function (p) { return p.id === 'liked'; })[0];
  var at = liked.tracks.findIndex(function (x) { return x.id === t.id; });
  var on;
  if (at >= 0) { liked.tracks.splice(at, 1); on = false; toast('Aus Favoriten entfernt'); }
  else { liked.tracks.push(t); on = true; toast('Zu Favoriten hinzugefügt'); }
  savePl(all);
  syncFavButtons();
  return on;
}
/* keep every visible heart in step, including the one in the player bar */
function syncFavButtons() {
  document.querySelectorAll('.row').forEach(function (r) {
    var b = r.querySelector('.r-fav'); if (!b) return;
    var on = likedList().some(function (x) { return x.id === r.dataset.tid; });
    b.textContent = on ? '♥' : '♡';
    b.classList.toggle('on', on);
  });
  var pb = $('#bFav');
  if (pb) {
    var on = !!(P.cur && isLiked(P.cur));
    pb.textContent = on ? '♥' : '♡';
    pb.classList.toggle('on', on);
  }
}

function trackRow(t, i, list) {
  var r = el('div', 'row');
  r.dataset.tid = t.id;
  r.innerHTML =
    '<div class="r-n">' + (i + 1) + '</div>' +
    (t.art ? '<img class="r-a" loading="lazy" src="' + esc(t.art) + '" onerror="this.style.visibility=\'hidden\'">' : '<div class="r-a"></div>') +
    '<div class="r-m"><div class="r-t">' + esc(t.title) + '</div><div class="r-s">' + esc(t.artist) + '</div></div>' +
    '<div class="r-q' + (t.lossless ? ' loss' : '') + '">' + esc(t.quality) + '</div>' +
    '<button class="r-fav' + (isLiked(t) ? ' on' : '') + '" title="Favorit">' + (isLiked(t) ? '♥' : '♡') + '</button>' +
    '<button class="r-add" title="Zu Playlist hinzufügen">＋</button>';
  r.onclick = function (e) {
    if (e.target.classList.contains('r-add')) { e.stopPropagation(); addTo(t); return; }
    if (e.target.classList.contains('r-fav')) {
      e.stopPropagation();
      var nowLiked = toggleLike(t);
      e.target.textContent = nowLiked ? '♥' : '♡';
      e.target.classList.toggle('on', nowLiked);
      return;
    }
    P.play(t, list, i);
  };
  return r;
}

function rowsBlock(list) {
  var wrap = el('div', 'rows');
  list.forEach(function (t, i) { wrap.appendChild(trackRow(t, i, list)); });
  return wrap;

/* add-to-playlist */
function addTo(t) {
  var pls = playlists();
  var names = pls.map(function (p, i) { return (i + 1) + '. ' + p.name; }).join('\n');
  var pick = prompt('Add "' + t.title + '" to:\n' + names + '\n\nType a number, or a new playlist name:', '1');
  if (!pick) return;
  var n = parseInt(pick, 10);
  var target;
  if (!isNaN(n) && pls[n - 1]) target = pls[n - 1];
  else { target = { id: 'p' + Date.now(), name: pick.trim(), tracks: [] }; pls.push(target); }
  if (target.tracks.some(function (x) { return x.id === t.id; })) { toast('Already in ' + target.name); return; }
  target.tracks.push(t);
  savePl(pls);
  toast('Added to ' + target.name);
}

    '<h2>Radio</h2><p>Feste Sender oben, darunter nach Genre stöbern.</p></div>'));

function openPlaylist(id) {
  go('pl');
  var p = playlists().filter(function (x) { return x.id === id; })[0];
  var page = $('#page'); page.innerHTML = '';
  if (!p) { page.appendChild(emptyBox('◌', 'Playlist gone', 'It may have been deleted.')); return; }
  page.appendChild(el('div', 'hero',
    '<div class="hero-art">' + (p.id === 'liked' ? '♥' : '≡') + '</div>' +
    '<div><small>Playlist</small><h2>' + esc(p.name) + '</h2><p>' + p.tracks.length + ' tracks</p></div>'));

  var bar = el('div'); bar.style.cssText = 'display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap';
  if (p.tracks.length) {
    var pb = el('button', 'btn', '▶ Play');
    pb.onclick = function () { P.play(p.tracks[0], p.tracks, 0); };
    bar.appendChild(pb);
  }
  if (p.id !== 'liked') {
    var db = el('button', 'btn ghost', 'Delete playlist');
    db.onclick = function () {
      if (!confirm('Delete "' + p.name + '"?')) return;
      savePl(playlists().filter(function (x) { return x.id !== id; }));
      go('playlists');
    };
    bar.appendChild(db);
  }
  page.appendChild(bar);

  if (!p.tracks.length) { page.appendChild(emptyBox('◌', 'Empty playlist', 'Use the ＋ button on any track to add it here.')); return; }

  var wrap = el('div', 'rows');
  p.tracks.forEach(function (t, i) {
    var r = trackRow(t, i, p.tracks);
    var rm = r.querySelector('.r-add');
    rm.textContent = '−'; rm.title = 'Remove';
    rm.onclick = function (e) {
      e.stopPropagation();
      var all = playlists();
      var tgt = all.filter(function (x) { return x.id === id; })[0];
      tgt.tracks = tgt.tracks.filter(function (x) { return x.id !== t.id; });
      savePl(all); openPlaylist(id); toast('Removed');
    };
    wrap.appendChild(r);
  });
  page.appendChild(wrap);
}

    '<div class="set-row"><div><b>Radio Browser</b><small>Live stations, continuous playback, up to 320k and FLAC</small></div><span class="qb">LIVE</span></div>';

  var r1 = el('div', 'set-row', '<div><b>Preferred quality</b><small>Used to sort results — lossless first when available</small></div>');
  var sel = el('select');
  [['lossless', 'Lossless / highest'], ['high', 'High (320k)'], ['std', 'Standard']].forEach(function (o) {

  var s3 = el('div', 'set');

  var row = el('div', 'set-row', '<div><b>Playlists &amp; history</b><small>' + playlists().length + ' playlists · ' + Store.get(pkey('hist'), []).length + ' played</small></div>');

  var ex = el('button', 'btn ghost', 'Export');
  ex.onclick = function () {
    var name = 'soundmaschine-' + App.uid + '.json';
    var json = JSON.stringify({ user: App.uid, playlists: playlists(), history: Store.get(pkey('hist'), []) }, null, 2);

    /* Hosted on claude.ai the page cannot start its own download — the viewer
       has to confirm one. Everywhere else (Netlify, local file) the blob link works. */
    var host = (window.claude && window.claude.use) ? window.claude.use('downloads') : null;
    Promise.resolve(host).then(function (dl) {
      if (!dl) throw new Error('no host');
      return dl.save({ filename: name, data: json }).then(function () { toast('Exported'); });
    }).catch(function (err) {
      if (err && err.code === 'declined') return;
      if (err && err.code) { toast('Export failed: ' + err.code); return; }
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = el('a'); a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    });
  };
  var cl = el('button', 'btn ghost', 'Clear history');
  cl.onclick = function () { if (confirm('Clear listening history for ' + u.name + '?')) { Store.set(pkey('hist'), []); toast('History cleared'); render(); } };
  box.appendChild(ex); box.appendChild(cl); row.appendChild(box); s3.appendChild(row);
  page.appendChild(s3);
};

function dayPart() { var h = new Date().getHours(); return h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening'; }

/* ============================================================

   ============================================================ */

  ['radio', '📻', 'Radio'],
  ['lossless', '◈', 'Lossless'],

function renderPlSidebar() {

/* Favourites live in their own sidebar block with the newest few visible, so the
   things you actually liked are one click away instead of behind a playlist. */
function renderFav() {
  var host = $('#favList'); if (!host) return;
  var liked = (playlists().filter(function (p) { return p.id === 'liked'; })[0] || { tracks: [] }).tracks;
  var cnt = $('#favCount'); if (cnt) cnt.textContent = liked.length;
  host.innerHTML = '';
  if (!liked.length) {
    host.appendChild(el('div', 'fav-empty', 'Noch keine Favoriten. Tippe auf ♥ neben einem Titel.'));
    return;
  }
  liked.slice(-5).reverse().forEach(function (t, i) {
    var b = el('button', 'fav-item',
      (t.art ? '<img src="' + esc(t.art) + '" alt="">' : '<div class="ph">♪</div>') +
      '<span class="m"><b>' + esc(t.title) + '</b><span>' + esc(t.artist) + '</span></span>');
    b.onclick = function () { P.play(t, liked.slice().reverse(), i); closeSide(); };
    host.appendChild(b);
  });
  if (liked.length > 5) {
    var all = el('button', 'fav-item', '<span class="m"><b style="color:var(--accent)">Alle ' + liked.length + ' anzeigen →</b></span>');
    all.onclick = function () { openPlaylist('liked'); closeSide(); };
    host.appendChild(all);
  }
}

function go(p) {
  App.page = p;
  renderNav();
  var titles = { home: 'Home', search: 'Search', radio: 'Radio', lossless: 'Lossless', library: 'Library', playlists: 'Playlists', settings: 'Settings', item: 'Album', pl: 'Playlist' };
  $('#ttl').textContent = titles[p] || 'Home';
  if (PAGES[p]) render();
  $('#main').scrollTop = 0;
}

function render() {
  var page = $('#page');
  page.innerHTML = '';
  var fn = PAGES[App.page];
  if (fn) { try { fn(page); } catch (e) { page.appendChild(emptyBox('!', 'Something broke rendering this page', esc(e.message))); } }
  P.paint();
}

/* ---------- search input ---------- */
var sT;
function doSearch(v) {
  App.q = v.trim();
  App.page = 'search';
  renderNav();
  $('#ttl').textContent = 'Search';

}

/* ---------- user switch ---------- */

/* ---------- theme ---------- */
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  Store.set('theme', t);
  $('#themeBtn').textContent = t === 'dark' ? '◐' : '◑';
}
/* first run follows any theme the host already stamped, else the OS preference;
   after that this app's own toggle wins */
function bootTheme() {
  var stamped = document.documentElement.getAttribute('data-theme');
  if (stamped === 'light' || stamped === 'dark') return stamped;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
}
setTheme(Store.get('theme', bootTheme()));
$('#themeBtn').onclick = function () {
  setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
};

/* ---------- mobile drawer ---------- */
function closeSide() { $('#side').classList.remove('open'); $('#scrim').hidden = true; }
$('#menuBtn').onclick = function () { $('#side').classList.add('open'); $('#scrim').hidden = false; };
$('#scrim').onclick = closeSide;

/* ---------- keyboard ---------- */
document.addEventListener('keydown', function (e) {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.code === 'Space') { e.preventDefault(); P.toggle(); }
  if (e.key === 'ArrowRight' && e.shiftKey) P.step(1);
  if (e.key === 'ArrowLeft' && e.shiftKey) P.step(-1);
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
});

/* ============================================================
   CONNECTIVITY — some hosts (the claude.ai artifact sandbox, strict
   corporate proxies) block outbound requests entirely. Say so plainly
   instead of showing empty shelves everywhere.
   ============================================================ */
var Net = {
  blocked: false,
  check: function () {
    var probe = 'https://archive.org/metadata/messian_dread_-_reasonings_in_dub_-_2006_net_album';
    var self = this;
    return getJSON(probe, 9000)
      .catch(function () { return jsonp(probe, 9000); })
      .then(function () { self.blocked = false; })
      .catch(function () { self.blocked = true; self.banner(); });
  },
  banner: function () {
    if (document.getElementById('netbanner')) return;
    var b = el('div', null,
      '<b>This page cannot reach the music services.</b>' +
      '<p>SOUNDMASCHINE loads everything live from Audius, the Internet Archive and Radio Browser. ' +
      'The preview sandbox on claude.ai blocks outside requests, so nothing can load here. ' +
      'Open <code>index.html</code> from your own machine, or put it on Netlify, and it works normally.</p>');
    b.id = 'netbanner';
    b.style.cssText =
      'margin:0 0 20px;padding:14px 16px;border-radius:10px;background:var(--bg2);' +
      'border:1px solid var(--accent);border-left-width:3px;font-size:13px;line-height:1.6';
    b.querySelector('p').style.cssText = 'margin-top:5px;color:var(--fg2)';
    b.querySelector('b').style.cssText = 'font-family:var(--f-disp);font-size:14px';
    var page = $('#page');
    page.insertBefore(b, page.firstChild);
  }
};

/* A host-injected badge (Netlify's, for one) is pinned to the bottom-right corner
   above everything. It appears after our script runs, so look for it once the page
   settles and reserve space rather than letting it cover the volume control. */
(function watchHostBadge() {
  var SEL = '#nl-badge-frame,[id*="badge-frame"],[class*="badge-frame"]';
  function check() {
    if (document.querySelector(SEL)) { document.body.classList.add('hostbadge'); return true; }
    return false;
  }
  if (check()) return;
  var tries = 0;
  var iv = setInterval(function () { if (check() || ++tries > 12) clearInterval(iv); }, 500);
  window.addEventListener('load', check);
})();

/* ---------- boot ---------- */
renderUser();
renderPlSidebar();
go('home');
Net.check();
/* keep the notice pinned across page changes once we know we are sandboxed */
(function () {
  var origRender = render;
  render = function () { origRender(); if (Net.blocked) Net.banner(); };
})();
window.SM = { App: App, P: P, Store: Store, Audius: Audius, Radio: Radio, Archive: Archive,
              Viz: Viz, Net: Net, Sugg: Sugg, isLiked: isLiked, toggleLike: toggleLike,
              Engine: Engine, Drawer: Drawer, Ambilight: Ambilight, Palette: Palette, MB: MB };

(function () {

  });

  var sig = $('#bSig'); if (sig) sig.onclick = function () { Drawer.toggle('signal'); };

  var amb = $('#bAmbi');

    amb.classList.toggle('on', Ambilight.on);
    amb.onclick = function () {
      amb.classList.toggle('on', Ambilight.toggle());
      toast('Ambilight ' + (Ambilight.on ? 'an' : 'aus'));
    };
  }
  document.addEventListener('keydown', function (e) {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if (e.key === 'i' || e.key === 'I') Drawer.toggle('signal');
    if (e.key === 'n' || e.key === 'N') Drawer.toggle('notes');
  });
})();

Sugg.init();

/* ---- 3. Suchfeld: Kreuz zum Leeren ---- */
(function () {
  var q = $('#q'), x = $('#qClear');
  if (!q || !x) return;
  function sync() { x.hidden = !q.value; }
  q.addEventListener('input', sync);
  x.onclick = function () {
    q.value = ''; sync(); q.focus();
    App.q = '';
    if (App.page === 'search') render();
  };
  sync();
})();

})();
