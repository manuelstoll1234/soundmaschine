<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOUNDMASCHINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* ---- palette: warm neutrals biased toward the accent, VU-meter amber for
   Manuel (valve glow / hi-fi meter), neon magenta for Maya (80s). ---- */
:root{
  --bg:#fbfaf8; --bg2:#f2f0ec; --bg3:#e8e5df; --bg4:#dad6ce;
  --fg:#17150f; --fg2:#57534a; --fg3:#8b8578;
  --line:#dfdbd3;
  --accent:#c25a00; --accent2:#9c4400; --accent-fg:#fff8f0;
  --radius:10px;
  --bar-h:96px; --side-w:248px;
  --f-disp:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
:root body.u-maya{ --accent:#b8006b; --accent2:#8f0053; --accent-fg:#fff5fa; }

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d0c0a; --bg2:#161410; --bg3:#201d18; --bg4:#2e2a23;
    --fg:#f6f3ed; --fg2:#a49d90; --fg3:#6e685c;
    --line:#2b2721;
    --accent:#ff9426; --accent2:#e0740c; --accent-fg:#1a0f02;
  }
  :root:not([data-theme="light"]) body.u-maya{ --accent:#ff4f9a; --accent2:#d92d78; --accent-fg:#22040f; }
}
:root[data-theme="dark"]{
  --bg:#0d0c0a; --bg2:#161410; --bg3:#201d18; --bg4:#2e2a23;
  --fg:#f6f3ed; --fg2:#a49d90; --fg3:#6e685c;
  --line:#2b2721;
  --accent:#ff9426; --accent2:#e0740c; --accent-fg:#1a0f02;
}
:root[data-theme="dark"] body.u-maya{ --accent:#ff4f9a; --accent2:#d92d78; --accent-fg:#22040f; }

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);
  font:15px/1.5 var(--f-body);
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
#shell{display:grid;grid-template-columns:var(--side-w) 1fr;height:100vh;padding-bottom:var(--bar-h)}

/* ---------- sidebar ---------- */
#side{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 14px;font-family:var(--f-disp);font-weight:800;letter-spacing:1.4px;font-size:14.5px}
.brand .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:14px;flex:none}

.usr{margin:0 12px 14px;position:relative}
.usr-btn{width:100%;display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--radius);background:var(--bg3);border:1px solid var(--line);transition:.15s}
.usr-btn:hover{background:var(--bg4)}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-fg);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.usr-meta{text-align:left;min-width:0;flex:1}
.usr-meta b{display:block;font-size:13.5px}
.usr-meta span{display:block;font-size:11px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usr-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg3);border:1px solid var(--line);border-radius:var(--radius);padding:5px;z-index:60;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.usr-menu[hidden]{display:none}
.usr-menu button{width:100%;display:flex;gap:9px;align-items:center;padding:8px;border-radius:7px;text-align:left}
.usr-menu button:hover{background:var(--bg4)}

nav{padding:0 8px;display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--fg2);font-weight:600;font-size:14px;width:100%;text-align:left;transition:.12s}
.nav:hover{color:var(--fg);background:var(--bg3)}
.nav.on{color:var(--fg);background:var(--bg3)}
.nav.on::before{content:"";position:absolute;margin-left:-12px;width:3px;height:17px;background:var(--accent);border-radius:3px}
.nav i{font-style:normal;width:18px;text-align:center;font-size:15px}

.side-sec{margin-top:16px;padding:0 18px;flex:1;overflow-y:auto;min-height:0}
.side-sec h4{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--fg3);margin-bottom:9px;font-weight:600}
.pl-link{display:flex;align-items:center;gap:8px;width:100%;padding:6px 0;color:var(--fg2);font-size:13px;text-align:left;transition:.12s}
.pl-link:hover{color:var(--fg)}
.pl-link b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-link em{font-style:normal;color:var(--fg3);font-size:11px;flex:none}
.side-foot{padding:12px 18px;border-top:1px solid var(--line);font-size:10.5px;color:var(--fg3);line-height:1.6}

/* ---------- main ---------- */
#main{overflow-y:auto;position:relative}
header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;padding:14px 26px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
h1#ttl{font-family:var(--f-disp);font-size:19px;font-weight:700;letter-spacing:-.2px;flex:none}
.search-wrap{flex:1;max-width:460px;position:relative}
#q{width:100%;padding:9px 14px 9px 36px;border-radius:999px;background:var(--bg3);border:1px solid var(--line);outline:none;font-size:14px}
#q:focus{border-color:var(--accent)}
.search-wrap::before{content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--fg3);font-size:17px}
.hdr-btn{width:34px;height:34px;border-radius:50%;background:var(--bg3);border:1px solid var(--line);display:grid;place-items:center;font-size:14px;transition:.15s;flex:none}
.hdr-btn:hover{background:var(--bg4)}
#page{padding:22px 26px 40px}

/* ---------- cards ---------- */
.sec{margin-bottom:34px}
.sec-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;gap:12px}
.sec-hd h2{font-family:var(--f-disp);font-size:17px;font-weight:700;letter-spacing:-.2px;text-wrap:balance}
.sec-hd p{font-size:12.5px;color:var(--fg2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:11px;cursor:pointer;transition:.16s;position:relative;overflow:hidden}
.card:hover{background:var(--bg3);transform:translateY(-2px)}
.art{width:100%;aspect-ratio:1;border-radius:7px;object-fit:cover;background:var(--bg4);display:block;margin-bottom:9px}
.art-ph{width:100%;aspect-ratio:1;border-radius:7px;background:linear-gradient(135deg,var(--bg4),var(--bg3));display:grid;place-items:center;font-size:30px;margin-bottom:9px}
.card b{display:block;font-size:13.5px;font-weight:650;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card span{display:block;font-size:12px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.tag{position:absolute;top:16px;right:16px;background:rgba(0,0,0,.72);color:#fff;font-family:var(--f-mono);font-size:9px;font-weight:600;letter-spacing:.4px;padding:3px 6px;border-radius:5px;backdrop-filter:blur(4px)}
.tag.loss{background:var(--accent);color:var(--accent-fg)}

/* rows */
.rows{display:flex;flex-direction:column;gap:1px}
.row{display:grid;grid-template-columns:30px 42px 1fr auto auto;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:.12s}
.row:hover{background:var(--bg3)}
.row.playing{background:var(--bg3)}
.row.playing .r-t{color:var(--accent)}
.r-n{color:var(--fg3);font-family:var(--f-mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.row:hover .r-n{color:var(--fg)}
.r-a{width:42px;height:42px;border-radius:5px;object-fit:cover;background:var(--bg4)}
.r-m{min-width:0}
.r-t{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-s{font-size:12px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-q{font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.3px;color:var(--fg3);border:1px solid var(--line);padding:2px 5px;border-radius:4px;white-space:nowrap}
.r-q.loss{color:var(--accent);border-color:var(--accent)}
.r-add{width:28px;height:28px;border-radius:50%;color:var(--fg3);font-size:17px;display:grid;place-items:center;opacity:0}
.row:hover .r-add{opacity:1}
.r-add:hover{color:var(--accent);background:var(--bg4)}

/* ---------- player bar ---------- */
#bar{position:fixed;bottom:0;left:0;right:0;height:var(--bar-h);background:var(--bg2);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr minmax(300px,42%) 1fr;align-items:center;gap:16px;padding:0 18px;z-index:70}
.np{display:flex;align-items:center;gap:12px;min-width:0}
.np img,.np .ph{width:56px;height:56px;border-radius:7px;object-fit:cover;background:var(--bg4);flex:none;display:grid;place-items:center;font-size:22px}
.np-m{min-width:0}
.np-m b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np-m span{display:block;font-size:11.5px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc{display:flex;flex-direction:column;align-items:center;gap:7px}
.pc-btns{display:flex;align-items:center;gap:14px}
.pb{color:var(--fg2);font-size:15px;transition:.14s;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.pb:hover{color:var(--fg)}
.pb.on{color:var(--accent)}
.pb-play{width:38px;height:38px;border-radius:50%;background:var(--fg);color:var(--bg);font-size:14px;display:grid;place-items:center;transition:.14s}
.pb-play:hover{transform:scale(1.07)}
.seek{display:flex;align-items:center;gap:9px;width:100%}
.seek span{font-family:var(--f-mono);font-size:10.5px;color:var(--fg3);font-variant-numeric:tabular-nums;width:38px;flex:none}
.seek span:last-child{text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;background:var(--bg4);outline:none;cursor:pointer;flex:1}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--accent)}
.pr{display:flex;align-items:center;justify-content:flex-end;gap:11px}
.qb{font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.4px;padding:3px 7px;border-radius:5px;border:1px solid var(--line);color:var(--fg2);white-space:nowrap}
.qb.loss{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#vol{width:82px;flex:none}
#viz{width:88px;height:34px;border-radius:6px;background:var(--bg3);cursor:pointer;flex:none}

/* ---------- misc ---------- */
.empty{text-align:center;padding:56px 20px;color:var(--fg2)}
.empty .ic{font-size:42px;margin-bottom:12px;opacity:.5}
.empty b{display:block;font-family:var(--f-disp);font-size:16px;font-weight:700;color:var(--fg);margin-bottom:6px}
.empty p{font-size:13px;max-width:400px;margin:0 auto;line-height:1.65}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--bg4);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{padding:6px 13px;border-radius:999px;background:var(--bg3);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--fg2);transition:.14s;font-family:var(--f-body)}
.chip:hover{color:var(--fg);border-color:var(--fg3)}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn{padding:8px 16px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:13px;transition:.14s}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:var(--bg3);color:var(--fg);border:1px solid var(--line)}
#toast{position:fixed;bottom:calc(var(--bar-h) + 16px);left:50%;transform:translateX(-50%) translateY(16px);background:var(--bg4);border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:.22s;box-shadow:0 8px 28px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.set{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;max-width:660px}
.set h3{font-family:var(--f-disp);font-size:14px;font-weight:700;margin-bottom:5px}
.set p{font-size:12.5px;color:var(--fg2);line-height:1.6;margin-bottom:11px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 0;border-top:1px solid var(--line)}
.set-row b{font-size:13px;font-weight:600}
.set-row small{display:block;color:var(--fg2);font-size:11.5px;margin-top:1px}
select{padding:6px 11px;border-radius:7px;background:var(--bg3);border:1px solid var(--line);outline:none;font-size:13px}
.hero{display:flex;align-items:flex-end;gap:20px;padding:20px;border-radius:14px;margin-bottom:26px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 26%,var(--bg2)),var(--bg2))}
.hero-art{width:112px;height:112px;border-radius:10px;background:var(--bg4);display:grid;place-items:center;font-size:44px;flex:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.hero small{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--fg2)}
.hero h2{font-family:var(--f-disp);font-size:30px;font-weight:800;letter-spacing:-.8px;line-height:1.1;margin:5px 0 7px;text-wrap:balance}
.hero p{font-size:13px;color:var(--fg2)}

@media(max-width:900px){
  :root{--side-w:0px;--bar-h:132px}
  #shell{grid-template-columns:1fr}
  #side{position:fixed;inset:0 auto 0 0;width:250px;z-index:120;transform:translateX(-100%);transition:.24s}
  #side.open{transform:none}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:110}
  #scrim[hidden]{display:none}
  #bar{grid-template-columns:1fr;grid-auto-rows:auto;gap:8px;padding:10px 14px;align-content:center}
  .pr{justify-content:center}
  #viz{display:none}
  header{padding:12px 16px;gap:10px}
  h1#ttl{display:none}
  #page{padding:16px 16px 30px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px}
  .row{grid-template-columns:36px 1fr auto}
  .r-n,.r-q{display:none}
  .hero{flex-direction:column;align-items:flex-start}
  .hero h2{font-size:22px}
}
@media(min-width:901px){#menuBtn,#scrim{display:none}}
</style>
</head>
<body class="u-manuel">

<div id="shell">
  <aside id="side">
    <div class="brand"><span class="dot">◈</span><span>SOUNDMASCHINE</span></div>

    <div class="usr">
      <button class="usr-btn" id="usrBtn">
        <span class="av" id="usrAv">M</span>
        <span class="usr-meta"><b id="usrName">Manuel</b><span id="usrGen">Alternative · HardCore</span></span>
        <span style="color:var(--fg3);font-size:10px">▾</span>
      </button>
      <div class="usr-menu" id="usrMenu" hidden></div>
    </div>

    <nav id="nav"></nav>

    <div class="side-sec">
      <h4>Your Playlists</h4>
      <div id="plList"></div>
    </div>
    <div class="side-foot">No account · No subscription<br>Everything stays in this browser</div>
  </aside>

  <main id="main">
    <header>
      <button class="hdr-btn" id="menuBtn">☰</button>
      <h1 id="ttl">Home</h1>
      <div class="search-wrap"><input id="q" placeholder="Search songs, artists, albums…" autocomplete="off"></div>
      <button class="hdr-btn" id="themeBtn" title="Toggle theme">◐</button>
    </header>
    <div id="page"></div>
  </main>
</div>
<div id="scrim" hidden></div>

<div id="bar">
  <div class="np">
    <div class="ph" id="npArt">♪</div>
    <div class="np-m"><b id="npT">Nothing playing</b><span id="npS">Pick something to start</span></div>
  </div>
  <div class="pc">
    <div class="pc-btns">
      <button class="pb" id="bShuf" title="Shuffle">⤨</button>
      <button class="pb" id="bPrev" title="Previous">⏮</button>
      <button class="pb-play" id="bPlay" title="Play">▶</button>
      <button class="pb" id="bNext" title="Next">⏭</button>
      <button class="pb" id="bRep" title="Repeat">⟳</button>
    </div>
    <div class="seek">
      <span id="tCur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0">
      <span id="tDur">0:00</span>
    </div>
  </div>
  <div class="pr">
    <canvas id="viz" title="Click to change visualizer mode"></canvas>
    <span class="qb" id="qBadge">—</span>
    <span style="color:var(--fg2);font-size:13px">🔊</span>
    <input type="range" id="vol" min="0" max="100" value="80">
  </div>
</div>

<!-- Two elements on purpose. Routing an element through Web Audio makes it output
     SILENCE when the stream sends no CORS headers, and most radio streams don't.
     So: #au plays everything untouched; #auX is reserved for archive.org, which
     does send CORS, and is the only one wired to the analyser. -->
<audio id="au" preload="none"></audio>
<audio id="auX" crossorigin="anonymous" preload="none"></audio>
<div id="toast"></div>
<script>
/* ============================================================
   SOUNDMASCHINE — single-file music app
   Sources (all keyless + CORS-safe from a browser):
     iTunes Search  : metadata, album art, 30s AAC previews
     Radio Browser  : full-length live streams (incl. high-bitrate)
     Internet Archive: full-length tracks, incl. FLAC / lossless
   ============================================================ */
(function () {
'use strict';

/* ---------- tiny helpers ---------- */
var $ = function (s) { return document.querySelector(s); };
var el = function (t, c, h) { var e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]; }); };
var mmss = function (s) { s = Math.max(0, Math.floor(s || 0)); var m = Math.floor(s / 60); return m + ':' + String(s % 60).padStart(2, '0'); };

/* Archive reports length as either "412.5" or "6:52" — parseFloat("6:52") gives 6, so split first */
function parseLen(v) {
  var s = String(v == null ? '' : v);
  if (s.indexOf(':') >= 0) {
    var p = s.split(':').map(parseFloat);
    if (p.length === 2) return (p[0] || 0) * 60 + (p[1] || 0);
    if (p.length === 3) return (p[0] || 0) * 3600 + (p[1] || 0) * 60 + (p[2] || 0);
  }
  return parseFloat(s) || 0;
}

var toastT;
function toast(msg) {
  var t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, 2400);
}

/* fetch JSON with timeout */
function getJSON(url, ms) {
  var ac = new AbortController();
  var to = setTimeout(function () { ac.abort(); }, ms || 12000);
  return fetch(url, { signal: ac.signal, headers: { 'Accept': 'application/json' } })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .finally(function () { clearTimeout(to); });
}

/* JSONP — iTunes supports ?callback=, our bulletproof fallback if CORS ever fails */
var jsonpN = 0;
function jsonp(url, ms) {

    (o.art ? '<img class="art" loading="lazy" src="' + esc(o.art) + '" onerror="this.outerHTML=\'<div class=&quot;art-ph&quot;>♪</div>\'">'
           : '<div class="art-ph">' + (o.icon || '♪') + '</div>') +
    '<b>' + esc(o.title) + '</b><span>' + esc(o.sub || '') + '</span>' +
    (o.tag ? '<div class="tag' + (o.lossless ? ' loss' : '') + '">' + esc(o.tag) + '</div>' : '');
  c.onclick = onClick;
  return c;
}

function section(title, sub) {

}

function loading(msg) { return el('div', 'empty', '<div class="ic"><span class="spin"></span></div><b>' + esc(msg || 'Loading…') + '</b>'); }
function emptyBox(icon, title, body) { return el('div', 'empty', '<div class="ic">' + icon + '</div><b>' + esc(title) + '</b><p>' + body + '</p>'); }

/* add-to-playlist */
function addTo(t) {
  var pls = playlists();
  var names = pls.map(function (p, i) { return (i + 1) + '. ' + p.name; }).join('\n');
  var pick = prompt('Add "' + t.title + '" to:\n' + names + '\n\nType a number, or a new playlist name:', '1');
  if (!pick) return;
  var n = parseInt(pick, 10);
  var target;
  if (!isNaN(n) && pls[n - 1]) target = pls[n - 1];
  else { target = { id: 'p' + Date.now(), name: pick.trim(), tracks: [] }; pls.push(target); }
  if (target.tracks.some(function (x) { return x.id === t.id; })) { toast('Already in ' + target.name); return; }
  target.tracks.push(t);
  savePl(pls);
  toast('Added to ' + target.name);
}

function openPlaylist(id) {
  go('pl');
  var p = playlists().filter(function (x) { return x.id === id; })[0];
  var page = $('#page'); page.innerHTML = '';
  if (!p) { page.appendChild(emptyBox('◌', 'Playlist gone', 'It may have been deleted.')); return; }
  page.appendChild(el('div', 'hero',
    '<div class="hero-art">' + (p.id === 'liked' ? '♥' : '≡') + '</div>' +
    '<div><small>Playlist</small><h2>' + esc(p.name) + '</h2><p>' + p.tracks.length + ' tracks</p></div>'));

  var bar = el('div'); bar.style.cssText = 'display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap';
  if (p.tracks.length) {
    var pb = el('button', 'btn', '▶ Play');
    pb.onclick = function () { P.play(p.tracks[0], p.tracks, 0); };
    bar.appendChild(pb);
  }
  if (p.id !== 'liked') {
    var db = el('button', 'btn ghost', 'Delete playlist');
    db.onclick = function () {
      if (!confirm('Delete "' + p.name + '"?')) return;
      savePl(playlists().filter(function (x) { return x.id !== id; }));
      go('playlists');
    };
    bar.appendChild(db);
  }
  page.appendChild(bar);

  if (!p.tracks.length) { page.appendChild(emptyBox('◌', 'Empty playlist', 'Use the ＋ button on any track to add it here.')); return; }

  var wrap = el('div', 'rows');
  p.tracks.forEach(function (t, i) {
    var r = trackRow(t, i, p.tracks);
    var rm = r.querySelector('.r-add');
    rm.textContent = '−'; rm.title = 'Remove';
    rm.onclick = function (e) {
      e.stopPropagation();
      var all = playlists();
      var tgt = all.filter(function (x) { return x.id === id; })[0];
      tgt.tracks = tgt.tracks.filter(function (x) { return x.id !== t.id; });
      savePl(all); openPlaylist(id); toast('Removed');
    };
    wrap.appendChild(r);
  });
  page.appendChild(wrap);
}

    '<div class="set-row"><div><b>Radio Browser</b><small>Live stations, continuous playback, up to 320k and FLAC</small></div><span class="qb">LIVE</span></div>';

  s2.innerHTML = '<h3>Playback</h3><p>Preferences for ' + esc(u.name) + '.</p>';
  var r1 = el('div', 'set-row', '<div><b>Preferred quality</b><small>Used to sort results — lossless first when available</small></div>');
  var sel = el('select');
  [['lossless', 'Lossless / highest'], ['high', 'High (320k)'], ['std', 'Standard']].forEach(function (o) {
    var op = el('option', null, o[1]); op.value = o[0];
    if (Store.get(pkey('qual'), u.quality) === o[0]) op.selected = true;

  });
  sel.onchange = function () { Store.set(pkey('qual'), this.value); toast('Saved'); };
  r1.appendChild(sel); s2.appendChild(r1);
  page.appendChild(s2);

  var s3 = el('div', 'set');
  s3.innerHTML = '<h3>Your data</h3><p>Nothing is uploaded anywhere. Export gives you a JSON file you can re-import later.</p>';
  var row = el('div', 'set-row', '<div><b>Playlists &amp; history</b><small>' + playlists().length + ' playlists · ' + Store.get(pkey('hist'), []).length + ' played</small></div>');
  var box = el('div'); box.style.cssText = 'display:flex;gap:8px';
  var ex = el('button', 'btn ghost', 'Export');
  ex.onclick = function () {
    var name = 'soundmaschine-' + App.uid + '.json';
    var json = JSON.stringify({ user: App.uid, playlists: playlists(), history: Store.get(pkey('hist'), []) }, null, 2);

    /* Hosted on claude.ai the page cannot start its own download — the viewer
       has to confirm one. Everywhere else (Netlify, local file) the blob link works. */
    var host = (window.claude && window.claude.use) ? window.claude.use('downloads') : null;
    Promise.resolve(host).then(function (dl) {
      if (!dl) throw new Error('no host');
      return dl.save({ filename: name, data: json }).then(function () { toast('Exported'); });
    }).catch(function (err) {
      if (err && err.code === 'declined') return;
      if (err && err.code) { toast('Export failed: ' + err.code); return; }
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = el('a'); a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    });
  };
  var cl = el('button', 'btn ghost', 'Clear history');
  cl.onclick = function () { if (confirm('Clear listening history for ' + u.name + '?')) { Store.set(pkey('hist'), []); toast('History cleared'); render(); } };
  box.appendChild(ex); box.appendChild(cl); row.appendChild(box); s3.appendChild(row);
  page.appendChild(s3);
};

function dayPart() { var h = new Date().getHours(); return h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening'; }

/* ============================================================
   NAV / ROUTER
   ============================================================ */
var NAV = [
  ['home', '⌂', 'Home'],
  ['search', '⌕', 'Search'],
  ['radio', '📻', 'Radio'],
  ['lossless', '◈', 'Lossless'],
  ['library', '📚', 'Library'],

function go(p) {
  App.page = p;

function render() {
  var page = $('#page');

/* ---------- search input ---------- */

  App.q = v.trim();

}

});
$('#q').addEventListener('keydown', function (e) { if (e.key === 'Enter') { clearTimeout(sT); doSearch(this.value); } });

/* ---------- user switch ---------- */
function renderUser() {
  var u = U();
  document.body.className = u.cls;
  $('#usrAv').textContent = u.initial;
  $('#usrName').textContent = u.name;

$('#usrBtn').onclick = function (e) { e.stopPropagation(); $('#usrMenu').hidden = !$('#usrMenu').hidden; };
document.addEventListener('click', function () { $('#usrMenu').hidden = true; });

/* ---------- theme ---------- */
function setTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  Store.set('theme', t);
  $('#themeBtn').textContent = t === 'dark' ? '◐' : '◑';
}
/* first run follows any theme the host already stamped, else the OS preference;
   after that this app's own toggle wins */
function bootTheme() {
  var stamped = document.documentElement.getAttribute('data-theme');
  if (stamped === 'light' || stamped === 'dark') return stamped;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
}
setTheme(Store.get('theme', bootTheme()));
$('#themeBtn').onclick = function () {
  setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
};

/* ---------- mobile drawer ---------- */
function closeSide() { $('#side').classList.remove('open'); $('#scrim').hidden = true; }
$('#menuBtn').onclick = function () { $('#side').classList.add('open'); $('#scrim').hidden = false; };
$('#scrim').onclick = closeSide;

/* ---------- keyboard ---------- */
document.addEventListener('keydown', function (e) {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.code === 'Space') { e.preventDefault(); P.toggle(); }
  if (e.key === 'ArrowRight' && e.shiftKey) P.step(1);
  if (e.key === 'ArrowLeft' && e.shiftKey) P.step(-1);
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
});

/* ============================================================
   CONNECTIVITY — some hosts (the claude.ai artifact sandbox, strict
   corporate proxies) block outbound requests entirely. Say so plainly
   instead of showing empty shelves everywhere.
   ============================================================ */
var Net = {
  blocked: false,
  check: function () {
    var probe = 'https://itunes.apple.com/search?media=music&limit=1&term=music';
    var self = this;
    return getJSON(probe, 9000)
      .catch(function () { return jsonp(probe, 9000); })
      .then(function () { self.blocked = false; })
      .catch(function () { self.blocked = true; self.banner(); });
  },
  banner: function () {
    if (document.getElementById('netbanner')) return;
    var b = el('div', null,
      '<b>This page cannot reach the music services.</b>' +
      '<p>SOUNDMASCHINE loads everything live from iTunes, the Internet Archive and Radio Browser. ' +
      'The preview sandbox on claude.ai blocks outside requests, so nothing can load here. ' +
      'Open <code>index.html</code> from your own machine, or put it on Netlify, and it works normally.</p>');
    b.id = 'netbanner';
    b.style.cssText =
      'margin:0 0 20px;padding:14px 16px;border-radius:10px;background:var(--bg2);' +
      'border:1px solid var(--accent);border-left-width:3px;font-size:13px;line-height:1.6';
    b.querySelector('p').style.cssText = 'margin-top:5px;color:var(--fg2)';
    b.querySelector('b').style.cssText = 'font-family:var(--f-disp);font-size:14px';
    var page = $('#page');
    page.insertBefore(b, page.firstChild);
  }
};

/* ---------- boot ---------- */
renderUser();
renderPlSidebar();
go('home');
Net.check();
/* keep the notice pinned across page changes once we know we are sandboxed */
(function () {
  var origRender = render;
  render = function () { origRender(); if (Net.blocked) Net.banner(); };
})();
window.SM = { App: App, P: P, Store: Store, iTunes: iTunes, Radio: Radio, Archive: Archive, Viz: Viz };

})();
